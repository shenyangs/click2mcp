<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#34432a;font:14px 'Avenir Next','PingFang SC',sans-serif;padding:24px 52px;max-width:680px;margin:0 auto}body>p{font-size:11px;color:#96a088;border-bottom:1px solid #e8ecdf;padding-bottom:18px;margin-top:0}h2{font-size:25px;font-weight:500;margin:20px 0}label{display:block;font-size:12px;color:#7c886e;margin:14px 0}input,select,button{display:block;padding:12px;color:#34432a;border:1px solid #dce3d1;border-radius:7px;width:100%;margin-top:8px;background:#fafbf7;font:14px inherit}button{background:#bde984;border-color:#b2de79;cursor:pointer;margin-top:18px;font-size:13px}#result p{background:#eef7df;padding:13px;border-radius:6px;color:#5f8338;font:13px monospace}</style></head><body><p>本地示例 · 无外部数据 · 无模型推理</p><h2>创建示例任务</h2><form><label>任务名称<input data-testid="task-name" maxlength="120" required autocomplete="off"></label><label>分类<select data-testid="category"><option value="Engineering">工程</option><option value="Design">设计</option><option value="Research">研究</option></select></label><button data-testid="submit">提交任务</button></form><div id="result"></div><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/fixture/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskName:document.querySelector('input').value,category:document.querySelector('select').value})});const data=await response.json();const p=document.createElement('p');p.dataset.testid='receipt';p.textContent=data.receipt;document.querySelector('#result').replaceChildren(p);});</script></body></html>
