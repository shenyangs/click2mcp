<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{background:#101824;color:#ebf2ff;font:16px system-ui;padding:32px}label{display:block;margin:20px 0}input,select,button{display:block;padding:12px;background:#202f43;color:white;border:1px solid #46566c;border-radius:8px;width:90%;margin-top:8px}button{background:#a2ef8b;color:#11241a;cursor:pointer}h2{font-size:25px}p{color:#9cacc1}</style></head><body><p>本地示例 · 无外部数据 · 无模型推理</p><h2>创建示例任务</h2><form><label>任务名称<input data-testid="task-name" maxlength="120" required autocomplete="off"></label><label>分类<select data-testid="category"><option value="Engineering">工程</option><option value="Design">设计</option><option value="Research">研究</option></select></label><button data-testid="submit">提交任务</button></form><div id="result"></div><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/fixture/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskName:document.querySelector('input').value,category:document.querySelector('select').value})});const data=await response.json();const p=document.createElement('p');p.dataset.testid='receipt';p.textContent=data.receipt;document.querySelector('#result').replaceChildren(p);});</script></body></html>
